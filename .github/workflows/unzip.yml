name: Unzip voices

on:
  push:
    paths:
      - "./vowel_outputs.zip"

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          mkdir -p audio/voices
          unzip -o vowel_outputs.zip -d audio/voices

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add audio/voices
          git diff --cached --quiet || git commit -m "Extract voice files"

      - name: Push
        run: git push
