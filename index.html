<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>母音実験 ランダム割り当てツール</title>

<style>
body{
    font-family:sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

h1{
    margin-top:0;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 5px rgba(0,0,0,.15);
}

input{
    width:120px;
}

table{
    border-collapse:collapse;
    width:100%;
    margin-top:10px;
}

th,td{
    border:1px solid #999;
    padding:4px;
    text-align:center;
}

button{
    padding:10px 18px;
    margin:5px;
    cursor:pointer;
}

#stimuliTable{
    max-height:400px;
    overflow:auto;
}

#assignTable{
    max-height:500px;
    overflow:auto;
}
</style>

</head>

<body>

<h1>母音実験 割り当てツール</h1>

<div class="card">

<h2>設定</h2>

<label>被験者数</label>
<input id="subjectCount" value="15">

<br><br>

<label>一人あたり刺激数</label>
<input id="stimuliPerSubject" value="30">

<br><br>

<label>変化量(カンマ区切り)</label><br>

<input
id="deltaList"
style="width:600px"
value="+100,-100,+200,-200,+300,-300,+400,-400">

<br><br>

<button onclick="generate()">
生成
</button>

<button onclick="downloadStimuli()">
刺激一覧CSV
</button>

<button onclick="downloadAssign()">
割り当てCSV
</button>

</div>

<div class="card">

<h2>刺激一覧</h2>

<div id="stimuliTable"></div>

</div>

<div class="card">

<h2>被験者ごとの割り当て</h2>

<div id="assignTable"></div>

</div>

<script>

const vowels=[
"a",
"i",
"u",
"e",
"o"
];

const formants=[
"Original",
"F0",
"F1",
"F2",
"F3",
"F4"
];

const names=[
"い",
"ろ",
"は",
"に",
"ほ",
"へ",
"と",
"ち",
"り",
"ぬ",
"る",
"を",
"わ",
"か",
"よ",
"た",
"れ",
"そ",
"つ",
"ね",
"な",
"ら",
"む",
"う",
"ゐ",
"の",
"お",
"く",
"や",
"ま",
"け",
"ふ",
"こ",
"え",
"て",
"あ",
"さ",
"き",
"ゆ",
"め",
"み",
"し",
"ゑ",
"ひ",
"も",
"せ",
"す"
];

let stimuli=[];
let assignments=[];

function pad(id){
    return String(id).padStart(3,"0");
}

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j=Math.floor(Math.random()*(i+1));

        [array[i],array[j]]=
        [array[j],array[i]];

    }

}

function generate(){

stimuli=[];
assignments=[];

const deltas=document
.getElementById("deltaList")
.value
.split(",")
.map(v=>v.trim());

let id=1;

for(const vowel of vowels){

    stimuli.push({

        id:pad(id++),

        vowel,

        formant:"Original",

        delta:"0"

    });

    for(const f of formants){

        if(f==="Original") continue;

        for(const d of deltas){

            stimuli.push({

                id:pad(id++),

                vowel,

                formant:f,

                delta:d

            });

        }

    }

}

shuffle(stimuli);

const subjectCount=parseInt(
document.getElementById("subjectCount").value
);

const perSubject=parseInt(
document.getElementById("stimuliPerSubject").value
);

let index=0;

for(let i=0;i<subjectCount;i++){

    let person=[];

    for(let j=0;j<perSubject;j++){

        person.push(
            stimuli[index % stimuli.length]
        );

        index++;

    }

    assignments.push({

        name:names[i] ?? ("被験者"+(i+1)),

        list:person

    });

}

showStimuli();
showAssign();

}
    function showStimuli(){

    let html="<table>";

    html+="<tr>";
    html+="<th>ID</th>";
    html+="<th>母音</th>";
    html+="<th>フォルマント</th>";
    html+="<th>変化量</th>";
    html+="</tr>";

    for(const s of stimuli){

        html+="<tr>";

        html+=`<td>${s.id}</td>`;
        html+=`<td>${s.vowel}</td>`;
        html+=`<td>${s.formant}</td>`;
        html+=`<td>${s.delta}</td>`;

        html+="</tr>";

    }

    html+="</table>";

    document.getElementById("stimuliTable").innerHTML=html;

}

function showAssign(){

    let html="<table>";

    html+="<tr>";
    html+="<th>被験者</th>";
    html+="<th>刺激ID</th>";
    html+="<th>母音</th>";
    html+="<th>フォルマント</th>";
    html+="<th>変化量</th>";
    html+="</tr>";

    for(const p of assignments){

        for(const s of p.list){

            html+="<tr>";

            html+=`<td>${p.name}</td>`;
            html+=`<td>${s.id}</td>`;
            html+=`<td>${s.vowel}</td>`;
            html+=`<td>${s.formant}</td>`;
            html+=`<td>${s.delta}</td>`;

            html+="</tr>";

        }

    }

    html+="</table>";

    document.getElementById("assignTable").innerHTML=html;

}

function download(filename,text){

    const blob=new Blob(
        [text],
        {type:"text/csv;charset=utf-8;"}
    );

    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");

    a.href=url;

    a.download=filename;

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    URL.revokeObjectURL(url);

}

function downloadStimuli(){

    let csv="id,vowel,formant,delta\n";

    for(const s of stimuli){

        csv+=`${s.id},${s.vowel},${s.formant},${s.delta}\n`;

    }

    download("stimuli.csv",csv);

}

function downloadAssign(){

    let csv="subject,id,vowel,formant,delta\n";

    for(const p of assignments){

        for(const s of p.list){

            csv+=`${p.name},${s.id},${s.vowel},${s.formant},${s.delta}\n`;

        }

    }

    download("assignment.csv",csv);

}

generate();

</script>

</body>

</html>
