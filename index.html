<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>母音実験 ランダム割り当てツール</title>

<style>
body{
    font-family:"Yu Gothic UI",sans-serif;
    background:#f5f7fb;
    margin:20px;
}

h1{
    color:#1d4ed8;
}

.card{
    background:white;
    border-radius:12px;
    padding:18px;
    margin-bottom:20px;
    box-shadow:0 3px 8px rgba(0,0,0,.15);
}

label{
    display:inline-block;
    width:170px;
    margin:5px 0;
}

input{
    padding:6px;
    width:280px;
}

button{
    padding:10px 18px;
    margin:5px;
    cursor:pointer;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:15px;
}

button:hover{
    background:#1d4ed8;
}

table{
    border-collapse:collapse;
    width:100%;
    margin-top:15px;
}

th,td{
    border:1px solid #ccc;
    padding:6px;
    text-align:center;
}

th{
    background:#2563eb;
    color:white;
}

#assignmentTable td{
    font-size:14px;
}

.small{
    color:#666;
    font-size:13px;
}
</style>

</head>

<body>

<h1>母音実験 ランダム割り当てツール</h1>

<div class="card">

<label>被験者数</label>
<input id="subjectCount" type="number" value="15"><br>

<label>一人当たり刺激数</label>
<input id="stimPerPerson" type="number" value="30"><br>

<label>母音</label>
<input id="vowels" value="a,i,u,e,o"><br>

<label>フォルマント</label>
<input id="formants" value="Original,F0,F1,F2,F3,F4"><br>

<label>変化量</label>
<input id="deltas"
value="+100,-100,+200,-200,+300,-300,+400,-400"><br>

<p class="small">
Originalは自動で1種類だけ作成されます。
</p>

<button onclick="generate()">生成</button>
<button onclick="downloadStimuli()">刺激一覧CSV</button>
<button onclick="downloadAssignment()">割り当てCSV</button>

</div>

<div class="card">

<h2>刺激一覧</h2>

<table id="stimuliTable">

<thead>

<tr>
<th>ID</th>
<th>母音</th>
<th>フォルマント</th>
<th>変化量</th>
</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

<div class="card">

<h2>被験者への割り当て</h2>

<table id="assignmentTable">

<thead>

<tr>
<th>被験者</th>
<th>刺激ID一覧</th>
</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

<script>

const kanaNames=[
"い","ろ","は","に","ほ","へ","と",
"ち","り","ぬ","る","を","わ","か",
"よ","た","れ","そ","つ","ね","な",
"ら","む","う","ゐ","の","お","く",
"や","ま","け","ふ","こ","え","て",
"あ","さ","き","ゆ","め","み","し",
"ゑ","ひ","も","せ","す"
];

let stimuli=[];
let assignments=[];

function pad(id){

    return id.toString().padStart(3,"0");

}

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        let j=Math.floor(Math.random()*(i+1));

        [array[i],array[j]]=[array[j],array[i]];

    }

}

function kanaName(index){

    if(index<kanaNames.length){

        return kanaNames[index];

    }

    let n=Math.floor(index/kanaNames.length)+1;

    return kanaNames[index%kanaNames.length]+n;

}

function generate(){

    stimuli=[];
    assignments=[];

    let vowels=document.getElementById("vowels")
        .value.split(",")
        .map(v=>v.trim());

    let formants=document.getElementById("formants")
        .value.split(",")
        .map(v=>v.trim());

    let deltas=document.getElementById("deltas")
        .value.split(",")
        .map(v=>v.trim());

    let id=1;

    for(let vowel of vowels){

        stimuli.push({

            id:pad(id++),

            vowel:vowel,

            formant:"Original",

            delta:"0"

        });

        for(let f of formants){

            if(f==="Original") continue;

            for(let d of deltas){

                stimuli.push({

                    id:pad(id++),

                    vowel:vowel,

                    formant:f,

                    delta:d

                });

            }

        }

    }

    shuffle(stimuli);

    // ===== この続きは後半 =====
        // ===== 被験者へ均等に割り当て =====

    let subjectCount=parseInt(
        document.getElementById("subjectCount").value
    );

    let stimPerPerson=parseInt(
        document.getElementById("stimPerPerson").value
    );

    let index=0;

    for(let s=0;s<subjectCount;s++){

        let ids=[];

        for(let i=0;i<stimPerPerson;i++){

            ids.push(stimuli[index % stimuli.length].id);

            index++;

        }

        assignments.push({

            subject:"被験者"+kanaName(s),

            ids:ids

        });

    }

    drawStimuli();

    drawAssignments();

}

function drawStimuli(){

    const tbody=document.querySelector(
        "#stimuliTable tbody"
    );

    tbody.innerHTML="";

    for(let s of stimuli){

        let tr=document.createElement("tr");

        tr.innerHTML=`
        <td>${s.id}</td>
        <td>${s.vowel}</td>
        <td>${s.formant}</td>
        <td>${s.delta}</td>
        `;

        tbody.appendChild(tr);

    }

}

function drawAssignments(){

    const tbody=document.querySelector(
        "#assignmentTable tbody"
    );

    tbody.innerHTML="";

    for(let a of assignments){

        let tr=document.createElement("tr");

        tr.innerHTML=`
        <td>${a.subject}</td>
        <td>${a.ids.join(", ")}</td>
        `;

        tbody.appendChild(tr);

    }

}

function makeStimuliCSV(){

    let csv="ID,母音,フォルマント,変化量\n";

    for(let s of stimuli){

        csv+=`${s.id},${s.vowel},${s.formant},${s.delta}\n`;

    }

    return csv;

}

function makeAssignmentCSV(){

    let csv="被験者,刺激ID\n";

    for(let a of assignments){

        for(let id of a.ids){

            csv+=`${a.subject},${id}\n`;

        }

    }

    return csv;

}

function download(filename,text){

    const blob=new Blob(
        [text],
        {type:"text/csv;charset=utf-8;"}
    );

    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");

    a.href=url;

    a.download=filename;

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    setTimeout(()=>{

        URL.revokeObjectURL(url);

    },100);

}

function downloadStimuli(){

    if(stimuli.length===0){

        alert("先に生成してください");

        return;

    }

    download(
        "stimuli.csv",
        makeStimuliCSV()
    );

}

function downloadAssignment(){

    if(assignments.length===0){

        alert("先に生成してください");

        return;

    }

    download(
        "assignment.csv",
        makeAssignmentCSV()
    );

}

// 初回生成
generate();

</script>

</body>
</html>
